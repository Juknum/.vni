[package]
name = "vni"
version = "0.1.0"
edition = "2021"
description = "Version-controlled image: a single-file image format that stores a base image plus authored, commit-like changes."
license = "MIT"

[lib]
name = "vni"
path = "src/lib.rs"

[[bin]]
name = "vni"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
